<!DOCTYPE html>
<html>
    <head>
        <title>Student table</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Bootstrap CSS -->
        <link href="styles/bootstrap.css" rel="stylesheet" type="text/css" />
        
    </head>

    <body>

        <!-- ================= NAVBAR ================= -->
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

            <div class="container-fluid">

                <!-- Website Name -->
                <a class="navbar-brand" href="#">
                    My Website
                </a>

                <!-- Navbar Toggle Button -->
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNav">

                    <span class="navbar-toggler-icon"></span>

                </button>

                <!-- Navbar Items -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav">

                        <!-- Home -->
                        <li class="nav-item">
                            <a class="nav-link active" href="#">
                                Home
                            </a>
                        </li>

                        <!-- About -->
                        <li class="nav-item">
                            <a class="nav-link" href="#">About</a>
                        </li>

                        <!-- Dropdown -->
                        <li class="nav-item dropdown">

                            <a class="nav-link dropdown-toggle"
                               href="#"
                               role="button"
                               data-bs-toggle="dropdown"
                               aria-expanded="false">
                                Dropdown
                            </a>
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" href="https://www.google.com">GOOGLE</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="https://www.whatsapp.com">WHATSAPP</a>
                                </li>
                                <li>
                                    <a class="dropdown-item" href="https://www.instagram.com">INSTAGRAM</a>
                                </li>
                            </ul>
                        </li>
                        <!-- Contact -->
                        <li class="nav-item">
                            <a class="nav-link" href="#">Contact</a>
                        </li>

                    </ul>


                    <!-- Navbar Form -->
                    <form class="d-flex ms-auto">

                        <input class="form-control me-2"
                               type="search"
                               placeholder="Search">

                        <button class="btn btn-success"
                                type="submit">
                            Search
                        </button>

                    </form>

                </div>

            </div>

        </nav>


        <!-- ================= MAIN CONTENT ================= -->

        <div class="container-fluid">

            <div class="row">


                <!-- ================= LEFT SIDE ================= -->

                <div class="col-4">

                    <!-- Student Table -->
                    <table class="table table-striped">

                        <thead>

                            <tr>
                                <th scope="col">S.No</th>
                                <th scope="col">Name</th>
                                <th scope="col">Age</th>
                                <th scope="col">City</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row"> </th>

                                <td>Amit Kumar</td>
                                <td>20</td>
                                <td>Lucknow</td>
                            </tr>
                            <tr>
                                <th scope="row">2</th>
                                <td>Yasir Ajaz</td>
                                <td>22</td>
                                <td>Mau</td>
                            </tr>
                            <tr>
                                <th scope="row">3</th>
                                <td>Zaid khan</td>
                                <td>26</td>
                                <td>Mau</td>
                            </tr>
                            <tr>

                                <th scope="row">4</th>
                                <td>Arsh</td>
                                <td>21</td>
                                <td>Sitapur</td>
                            </tr>
                        </tbody>
                    </table>
                    <!-- ================= BOOTSTRAP BUTTONS ================= -->
                    <button type="button" class="btn">Basic</button>
                    <button type="button" class="btn btn-primary">Primary</button>

                    <button type="button" class="btn btn-secondary">
                        Secondary
                    </button>

                    <button type="button" class="btn btn-success">
                        Success
                    </button>

                    <button type="button" class="btn btn-info">
                        Info
                    </button>

                    <button type="button" class="btn btn-warning">
                        Warning
                    </button>

                    <button type="button" class="btn btn-danger">
                        Danger
                    </button>

                    <button type="button" class="btn btn-dark">
                        Dark
                    </button>

                    <button type="button" class="btn btn-light">
                        Light
                    </button>

                    <button type="button" class="btn btn-link">
                        Link
                    </button>


                    <br><br>


                    <!-- Link Button -->
                    <a href="#" class="btn btn-success">
                        Link Button
                    </a>


                    <br><br>


                    <!-- Different Types of Buttons -->

                    <button type="button" class="btn btn-success">
                        Button
                    </button>

                    <input type="button"
                           class="btn btn-success"
                           value="Input Button">

                    <input type="submit"
                           class="btn btn-success"
                           value="Submit Button">

                    <input type="reset"
                           class="btn btn-success"
                           value="Reset Button">

                </div>


                <!-- ================= CARD ================= -->

                <div class="col-4">

                    <div class="card"
                         style="width:300px">

                        <img class="card-img-top"
                             src="images/laser.jpg"
                             alt="Card image">

                        <div class="card-body">

                            <h4 class="card-title">
                                John Cena
                            </h4>

                            <p class="card-text">
                                PM of INDIA
                            </p>

                            <a href="#"
                               class="btn btn-primary">
                                See Profile
                            </a>

                        </div>

                    </div>

                </div>


                <!-- ================= BAT IMAGE ================= -->

                <div class="col-4">

                    <img src="images/bat.jpeg"
                         class="rounded float-end"
                         alt="bat"
                         height="200"
                         width="300">

                </div>


            </div>
            <div class="col-12">
                <!-- Carousel -->
                <div id="demo" class="carousel slide" data-bs-ride="carousel">

                  <!-- Indicators/dots -->
                  <div class="carousel-indicators">
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
                    <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
                  </div>

                  <!-- The slideshow/carousel -->
                  <div class="carousel-inner">
                    <div class="carousel-item active">
                      <img src="images/bat.jpeg" alt="Los Angeles" class="d-block w-100" style="height:600px; object-fit:cover;">
                    </div>
                    <div class="carousel-item">
                      <img src="images/thanos.jpg" alt="Chicago" class="d-block w-100" style="height:600px; object-fit:cover;">
                    </div>
                    <div class="carousel-item">
                      <img src="images/samurai.jpg" alt="New York" class="d-block w-100" style="height:600px; object-fit:cover;">
                    </div>
                  </div>

                  <!-- Left and right controls/icons -->
                  <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                  </button>
                  <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                  </button>
                </div>
            </div>
            
            <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
                Open Modal
            </button>
            <div class="modal" id="myModal">

                <div class="modal-dialog">

                    <div class="modal-content">

                        <div class="modal-header">
                            <h4 class="modal-title">My Modal</h4>

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal">
                            </button>
                        </div>

                        <div class="modal-body">

                            <form>

                                <div class="mb-3">
                                    <label class="form-label">Name</label>
                                    <input type="text" class="form-control" placeholder="Enter your name">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Email</label>
                                    <input type="email" class="form-control" placeholder="Enter your email">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" class="form-control" placeholder="Enter your password">
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    Submit
                                </button>

                            </form>

                        </div>

                        <div class="modal-footer">

                            <button type="button"
                                    class="btn btn-danger"
                                    data-bs-dismiss="modal">
                                Close
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- Bootstrap JavaScript Bundle -->
        <script src="js/bootstrap.bundle.js"
                type="text/javascript">
        </script>

    </body>
</html>
